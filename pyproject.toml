[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "Git engineering-analytics ETL: GitHub + git history -> Postgres star schema -> metrics, report and API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pandas-stubs"]

[project.scripts]
gitpulse = "gitpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitpulse = ["sql/**/*.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=gitpulse --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/gitpulse/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
# E501: the formatter owns line length; what remains are SQL string literals.
ignore = ["S101", "B008", "S311", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/gitpulse/report.py" = ["RUF001"]  # en dash / multiplication sign are intended typography

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["gitpulse"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
