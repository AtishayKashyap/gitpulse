# Weekly engineering report, published to GitHub Pages (free).
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Publish report

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gitpulse }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install . "sentinel-dq @ git+https://github.com/AtishayKashyap/sentinel-dq"
      - run: gitpulse extract && gitpulse transform
      - run: sentinel run -c dq/sentinel.yml
      - run: gitpulse report --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
